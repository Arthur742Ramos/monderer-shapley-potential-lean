# Locally prepared advisory rendering wrapper. Not dispatched or published.
# Official renderer/audit/sanitizer are pinned; this is not registry acceptance.
name: Advisory trusted Challenge rendering
run-name: Render frozen Monderer–Shapley Challenge @${{ inputs.source_commit }}

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Frozen candidate commit; must equal this dispatched workflow commit"
        required: true
        type: string
      challenge_sha256:
        description: "SHA-256 of Challenge.lean from that exact source commit"
        required: true
        type: string
        default: "8a32c262e64226e0c4ea84e2c4ac08f86e0df9cd6019cbe4c3b3e18614e6681a"
      approve_binary_scoped_apparmor:
        description: "Set true only after specific approval to load the pinned installer's exact-bwrap userns profile on this disposable runner if required"
        required: true
        type: boolean
        default: false
      execution_profile:
        description: "Approved official resource profile; standard uses public GitHub ubuntu-24.04"
        required: true
        type: choice
        options:
          - palomar-standard-v1
          - palomar-namespace-16x32-v1
        default: palomar-standard-v1

permissions:
  contents: read

concurrency:
  group: palomar-advisory-render-${{ github.repository }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      labels: ${{ steps.resolve.outputs.labels }}
      render_timeout: ${{ steps.resolve.outputs.render_timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: 65f0154ed776cd26c224254aa57b379137f28b0d
          persist-credentials: false
      - id: resolve
        env:
          PALOMAR_EXECUTION_PROFILE: ${{ inputs.execution_profile }}
        run: python3 scripts/verification_profile.py --resolve
  render:
    needs: profile
    runs-on: ${{ fromJSON(needs.profile.outputs.labels) }}
    env:
      PALOMAR_EXECUTION_PROFILE: ${{ inputs.execution_profile }}
    timeout-minutes: ${{ fromJSON(needs.profile.outputs.render_timeout) }}
    steps:
      - name: Require exact frozen source and reviewed statement binding
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DISPATCHED_COMMIT: ${{ github.sha }}
          CHALLENGE_SHA256: ${{ inputs.challenge_sha256 }}
        run: |
          test "$SOURCE_COMMIT" = "$DISPATCHED_COMMIT"
          test "$CHALLENGE_SHA256" = "8a32c262e64226e0c4ea84e2c4ac08f86e0df9cd6019cbe4c3b3e18614e6681a"

      - name: Create advisory render artifact identifier
        id: request
        run: python3 -c 'import os,uuid; open(os.environ["GITHUB_OUTPUT"],"a").write("id="+uuid.uuid4().hex+"\n")' 

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout pinned official renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: 65f0154ed776cd26c224254aa57b379137f28b0d
          path: pipeline
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"

      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt

      - name: Record official selected-profile capacity
        env:
          PROFILE: ${{ inputs.execution_profile }}
        run: python3 pipeline/scripts/verification_profile.py --profile "$PROFILE" --disk-path "$RUNNER_TEMP" > "$RUNNER_TEMP/renderer-capacity.json"

      - name: Fetch and bind frozen candidate source
        id: prepare
        working-directory: pipeline
        env:
          SOURCE_REPOSITORY: Arthur742Ramos/monderer-shapley-potential-lean
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CHALLENGE_SHA256: ${{ inputs.challenge_sha256 }}
          PROJECT_PATH: ""
          CHALLENGE_PATH: Challenge.lean
          SOLUTION_PATH: Solution.lean
          COMPARATOR_CONFIG_PATH: comparator.json
          LAKEFILE_PATH: lakefile.toml
          LEAN_TOOLCHAIN_PATH: lean-toolchain
        run: |
          python -m scripts.render_challenge prepare \
            --repository "$SOURCE_REPOSITORY" \
            --commit "$SOURCE_COMMIT" \
            --challenge-sha256 "$CHALLENGE_SHA256" \
            --project-path "$PROJECT_PATH" \
            --challenge-path "$CHALLENGE_PATH" \
            --solution-path "$SOLUTION_PATH" \
            --comparator-config-path "$COMPARATOR_CONFIG_PATH" \
            --lakefile-path "$LAKEFILE_PATH" \
            --lean-toolchain-path "$LEAN_TOOLCHAIN_PATH" \
            --work-dir "$RUNNER_TEMP/palomar-render" \
            --output "$RUNNER_TEMP/palomar-render/report.json"

      - name: Require reviewed toolchain-compatible Verso revision
        if: steps.prepare.outputs.ready == 'true'
        env:
          VERSO_COMMIT: ${{ steps.prepare.outputs.verso_commit }}
        run: test "$VERSO_COMMIT" = "9f8096e40b31715b1d8d5997f15a0bd832f7e37d"

      - name: Install pinned elan
        if: steps.prepare.outputs.ready == 'true'
        run: |
          python3 pipeline/scripts/trusted_download.py \
            --url https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            --sha256 df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install accepted Lean toolchain
        if: steps.prepare.outputs.ready == 'true'
        env:
          LEAN_TOOLCHAIN: ${{ steps.prepare.outputs.lean_toolchain }}
        run: elan toolchain install "$LEAN_TOOLCHAIN"

      - name: Require specific approval before conditional AppArmor change
        if: steps.prepare.outputs.ready == 'true'
        env:
          APPROVED: ${{ inputs.approve_binary_scoped_apparmor }}
        run: |
          restriction="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          case "$restriction" in 0|1) ;; *) echo "Unknown AppArmor restriction value" >&2; exit 2 ;; esac
          printf 'apparmor_restrict_unprivileged_userns=%s\n' "$restriction"
          if [ "$restriction" = 1 ] && [ "$APPROVED" != true ]; then
            echo "Specific approval is required before the pinned installer writes /etc/apparmor.d/palomar-bwrap and loads its exact-binary userns profile" >&2
            exit 2
          fi

      - name: Build pinned bubblewrap
        if: success() && steps.prepare.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config >/dev/null
          echo "PALOMAR_BWRAP=$(pipeline/scripts/install_bwrap.sh "$RUNNER_TEMP/bwrap-bin")" >> "$GITHUB_ENV"

      - name: Build, sanitize, and hash Challenge rendering under bubblewrap
        if: steps.prepare.outputs.ready == 'true'
        working-directory: pipeline
        run: |
          python -m scripts.render_challenge execute \
            --work-dir "$RUNNER_TEMP/palomar-render" \
            --output "$RUNNER_TEMP/palomar-render/report.json" \
            --bwrap "$PALOMAR_BWRAP" \
            --renderer-commit "65f0154ed776cd26c224254aa57b379137f28b0d" \
            --bwrap-source-tag v0.12.0 \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload bounded render result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: advisory-challenge-render-${{ steps.request.outputs.id }}
          path: |
            ${{ runner.temp }}/renderer-capacity.json
            ${{ runner.temp }}/palomar-render/report.json
            ${{ runner.temp }}/palomar-render/result
          if-no-files-found: error
          retention-days: 30

      - name: Require a successful render
        if: always()
        run: |
          python -c 'import json, os, pathlib, sys; p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "palomar-render" / "report.json"; sys.exit(0 if json.loads(p.read_text())["status"] == "pass" else 1)'
