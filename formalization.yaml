version: "v0.4"
project:
  name: "Monderer–Shapley Exact-Potential Characterization"
  description: >-
    The full cycle characterization for arbitrary finite player types and arbitrary
    nonempty player-dependent action spaces. A real-valued exact potential exists
    if and only if deviators' payoff differences sum to zero around every finite
    closed path, every finite simple closed path, every simple four-cycle, or
    every two-player rectangle. The construction uses finite-subset induction
    and imposes no finiteness restriction on actions. Exact potentials are unique
    up to an additive constant. With finite actions, the cycle condition yields
    a pure Nash equilibrium. Adversarial examples distinguish matching pennies,
    infinite actions, unequal dependent actions, and the finite-action boundary.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy Jose Guerra Barretto de Queiroz"
  responsible_maintainers:
    - "Arthur Freitas Ramos"
  license: "Apache-2.0"
