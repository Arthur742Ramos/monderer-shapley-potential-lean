status:
  scope: >-
    Full arbitrary finite-player characterization. Each player's action type can
    be different and infinite; every action type is nonempty. Players may be empty.
    All finite closed paths are quantified with no length bound. The companion
    pure-Nash existence result additionally requires finite action types.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
automation:
  methods:
    - method: agent
      models: ["GPT-6.1 Sol"]
      framework: "Lean 4 and mathlib"
      tool_setup: "AI-assisted primary-source research, proof construction, separate mathematical and implementation reviews, and compiled adversarial examples."
  spend_usd: "not tracked"
  notes: >-
    The responsible maintainer selected and authorized the next proof.
    All proved declarations are Lean-kernel checked. The standalone Challenge's
    three deliberate theorem holes are excluded from proof-admission counts.
fidelity:
  divergences: >-
    Finite move lists tag the deviating player and also allow no-op updates.
    No-op deletion preserves endpoints and payoff integrals, proved explicitly.
    Simple closed paths allow a degenerate one-step no-op loop; its integral is
    zero. The empty-player market is a harmless extension with one empty profile.
    The local construction uses finite-subset insertion instead of the source's
    path-commutation proof. Rectangle conditions include degenerate choices,
    proved automatically zero in the simple-cycle bridge.
review:
  status: "Independent AI-assisted source/statement and implementation reviews passed; local Lean, exact statement/definition matching, standard-axiom, fresh-kernel, NanoDa and verified con-ron checks passed. Official Comparator, hosted standard-profile execution and trusted rendering remain pending."
  notes: >-
    Independent tests reject matching pennies; instantiate truly dependent and
    infinite action types and empty players; and verify a real-action exact
    potential game with no pure Nash, guarding the finite-action boundary.
    No human-review, source-author endorsement or registry-acceptance claim.
